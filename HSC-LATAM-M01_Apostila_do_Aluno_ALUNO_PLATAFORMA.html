<td colspan=\"1\" style=\"border-top:1.0px solid #D8DCE3;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #D8DCE3;border-right:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><textarea class=\"fld\" data-k=\"apo:n13\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:4.1px;font-size:5.4px\">&nbsp;</p>", "refs": ["anvisa", "cofepris", "dof", "mercosur", "invima", "digemid", "bcn"]}, {"id": "s5", "kicker": "SEÇÃO 1.4", "title": "Harmonização", "ex": "1.4", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">SEÇÃO 1.4</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#011072\">Harmonização</span></p><div class=\"apo-chips\"><span class=\"apo-chip\">No encontro: slides 18 a 22</span></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Se cada país tem regras próprias, como montar um dossiê só? Três instrumentos respondem: o <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a> dá a espinha técnica (princípios essenciais do <a class=\"hot\" data-refs=\"imdrf\">N47</a> e guias de revisão), o <a class=\"hot\" data-refs=\"mercosur\">RTM MERCOSUR</a> dá a regra jurídica comum entre Brasil e Argentina (<a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a>) e o MDSAP dá uma auditoria de sistema da qualidade aproveitada por várias autoridades.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:26.00%\"><col style=\"width:37.00%\"><col style=\"width:37.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PAÍS</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">IMDRF</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">MDSAP</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_br\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Brasil</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Membro</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Membro</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_ar\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Argentina</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Observador oficial</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Afiliado</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_mx\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">México</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Afiliado</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Afiliado</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_co\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Colômbia</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Afiliado</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Fora da lista oficial</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_pe\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Peru</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Afiliado</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Fora da lista oficial</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_cl\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Chile</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Afiliado</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Fora da lista oficial</span></p></td></tr></table></div><div class=\"apo-box apo-fix\"><b class=\"k\">Para fixar</b><p>Estar no <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a> e estar no MDSAP são coisas diferentes. Os membros do MDSAP são TGA, ANVISA, Health Canada, MHLW/PMDA e FDA.</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\">Página oficial do <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a>; página do MDSAP no FDA</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Princípios essenciais já estão nas normas</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O <a class=\"hot\" data-refs=\"imdrf\">N47</a> do <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a> (<a class=\"hot\" data-refs=\"imdrf\">N47 FINAL:2024</a>, Edition 2, de 26/04/2024) lista os princípios essenciais de segurança e desempenho e substituiu o GHTF/SG1/N68:2012. Esses princípios já aparecem, com outros nomes, em toda a região: o Peru exige uma Lista de Verificación com a norma e o documento de evidência de cada princípio (<a class=\"hot\" data-refs=\"digemid\">DS 003-2020-SA</a>, art. 10 e Anexo 2); a Colômbia pede as soluções adotadas para os requisitos essenciais em IIa, IIb e III (<a class=\"hot\" data-refs=\"invima\">Decreto 4725</a>, art. 18 j); o Chile verifica pela NCh ISO 16142-1 e 16142-2 (<a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25</a>, art. 2); o MERCOSUR liga o Informe Técnico aos requisitos essenciais da <a class=\"hot\" data-refs=\"mercosur\">GMC 72/98</a> (<a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a>, Ap. V, 3.6); e a <a class=\"hot\" data-refs=\"dof\">NOM-241</a> do México declara concordância com o <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a> <a class=\"hot\" data-refs=\"imdrf\">N47</a>:2024 (cap. 19).</span></p><div class=\"apo-box apo-fix\"><b class=\"k\">Para fixar</b><p>Uma matriz de princípios essenciais bem feita no core dossier atende a região com ajustes de formato. É o tema do Módulo 3.</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"imdrf\">IMDRF</a>/GRRP WG/<a class=\"hot\" data-refs=\"imdrf\">N47 FINAL:2024</a>, Introduction; <a class=\"hot\" data-refs=\"digemid\">DS 003-2020-SA</a> art. 10 e Anexo 2; <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> art. 18 j; <a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a> art. 2º; <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> Ap. V 3.6; <a class=\"hot\" data-refs=\"dof\">NOM-241-SSA1-2025</a> cap. 19</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">RTM MERCOSUR</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> (Montevidéu, 13/10/2021) revogou a <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 40/00</a> (art. 4). Vale para o comércio entre Estados Partes e para importações de fora do bloco, deixa de fora produtos usados ou recondicionados e IVD, classifica em I a IV com 22 regras (Ap. II) e permite simplificação opcional para Classes I e II (Parte 3, item 13). Para o importado, pede carta do fabricante e CLV com até 2 anos, apostilados e traduzidos.</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> arts. 2, 4 e 5; Parte 1 item 4; Parte 2; Parte 3 itens 6 e 13; Ap. II</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">O que o MDSAP compra na LATAM</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:16.00%\"><col style=\"width:54.00%\"><col style=\"width:30.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PAÍS</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">EVIDÊNCIA DE SGQ ACEITA</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">BASE</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_mx\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">México</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a> ou CE equivalem ao certificado de BPF; <a class=\"hot\" data-refs=\"dof\">NOM-241</a> alinhada ao MDSAP</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"cofepris\">Guía COFEPRIS</a> 1.7; <a class=\"hot\" data-refs=\"dof\">NOM-241</a> cap. 19</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_pe\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Peru</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">CE, <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a> ou FDA no lugar do Certificado de BPM da DIGEMID, em todas as classes</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"digemid\">DS 016-2011-SA</a>, arts. 124-127, item 3</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_co\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Colômbia</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">CCAA, BPM ou equivalente</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"invima\">Decreto 4725</a>, art. 18, b</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_cl\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Chile</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"iso-13485\">NCh ISO 13485</a> entre as normas-base</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25</a>, art. 2</span></p></td></tr></table></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Na Colômbia e no Chile, que estão fora da lista oficial do MDSAP, o certificado funciona como evidência forte de <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a>.</span></p><div class=\"apo-check\"><div class=\"ck\">Checagem rápida</div><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Como a Argentina participa do <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a>?</span></p><p class=\"opt\" data-q=\"apo:q6\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Membro</span></p><p class=\"opt\" data-q=\"apo:q6\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Observador oficial</span></p><p class=\"opt\" data-q=\"apo:q6\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Membro afiliado</span></p><p class=\"opt\" data-q=\"apo:q6\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não participa</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\">Página oficial do <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a></span></p></div><div class=\"apo-check apo-an\"><div class=\"ck\">Análise de caso 5</div><p style=\"margin-top:0px;margin-bottom:6px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Um fabricante brasileiro com certificado MDSAP pergunta se o certificado &quot;vale como aprovação&quot; no Peru.</span></p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">O que você responde?</span></p><p class=\"opt\" data-q=\"apo:a5\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim: o Peru é membro do MDSAP e aceita o certificado como registro</span></p><p class=\"opt\" data-q=\"apo:a5\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não como registro: o Peru está fora da lista oficial do MDSAP; o que a norma aceita é CE, ISO 13485 ou FDA no lugar do Certificado de BPM da DIGEMID, e o dossiê é avaliado</span></p><p class=\"opt\" data-q=\"apo:a5\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim: basta o certificado e a carta do fabricante</span></p><p class=\"opt\" data-q=\"apo:a5\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não: o Peru não aceita nenhuma evidência estrangeira</span></p><details class=\"apo-why\"><summary>Ver justificativa</summary><p>Estar no <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a> não é estar no MDSAP. No Peru, certificados estrangeiros entram como evidência de sistema da qualidade (<a class=\"hot\" data-refs=\"digemid\">DS 016-2011-SA</a>, arts. 124 a 127, item 3), mas a DIGEMID avalia o dossiê completo: é aproveitamento de evidência, não reliance.</p></details><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"digemid\">DS 016-2011-SA</a>, arts. 124 a 127, item 3; página do MDSAP no FDA</span></p></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Minhas anotações</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:100.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #D8DCE3;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #D8DCE3;border-right:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><textarea class=\"fld\" data-k=\"apo:n14\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:4.1px;font-size:5.4px\">&nbsp;</p>", "refs": ["cofepris", "dof", "mercosur", "invima", "digemid", "bcn", "imdrf", "iso-13485"]}, {"id": "s6", "kicker": "SEÇÃO 1.5", "title": "Reliance", "ex": "1.5", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">SEÇÃO 1.5</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#011072\">Reliance</span></p><div class=\"apo-chips\"><span class=\"apo-chip\">No encontro: slides 23 a 27</span></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Muita gente chama tudo de reliance, e isso gera expectativa errada no cliente. A guia da COFEPRIS separa os conceitos assim:</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:30.00%\"><col style=\"width:70.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">CONCEITO</span></p></td><td colspan=\"1\" style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">O QUE É</span></p></td></tr><tr><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Reliance</span></p></td><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">A autoridade usa a avaliação de outra; a decisão continua própria</span></p></td></tr><tr><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Reconhecimento</span></p></td><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Aceita a decisão da outra sem nova avaliação técnica</span></p></td></tr><tr><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Aproveitamento de evidência</span></p></td><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Certificados estrangeiros entram no dossiê, mas tudo é reavaliado</span></p></td></tr></table></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, art. 4, fr. XVIII e XX; <a class=\"hot\" data-refs=\"cofepris\">Guía de Requisitos Vía Regulatoria Abreviada</a> (COFEPRIS, 12/06/2026), seção 3</span></p><div class=\"apo-dg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 200\" width=\"100%\" role=\"img\" aria-label=\"Três formas de aproveitar uma aprovação estrangeira\" style=\"max-width:760px;display:block;margin:6px 0 4px\"><rect x=\"10\" y=\"40\" width=\"236\" height=\"150\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D8DCE3\" stroke-width=\"1.5\"/><text x=\"128\" y=\"74\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700\" fill=\"#011072\" text-anchor=\"middle\">Aproveitamento de evidência</text><text x=\"128\" y=\"104.0\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">Certificados estrangeiros entram</text><text x=\"128\" y=\"120.9\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">no dossiê, mas tudo é reavaliado</text><line x1=\"34\" y1=\"146\" x2=\"222\" y2=\"146\" stroke=\"#D8DCE3\" stroke-width=\"1\"/><text x=\"128\" y=\"172\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600\" fill=\"#4A6CF7\" text-anchor=\"middle\">Peru e Colômbia (hoje)</text><rect x=\"262\" y=\"40\" width=\"236\" height=\"150\" rx=\"10\" fill=\"#F0F2FF\" stroke=\"#4A6CF7\" stroke-width=\"1.5\"/><text x=\"380\" y=\"74\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700\" fill=\"#011072\" text-anchor=\"middle\">Reliance</text><text x=\"380\" y=\"104.0\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">Usa a avaliação de outra</text><text x=\"380\" y=\"120.9\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">autoridade; a decisão é própria</text><line x1=\"286\" y1=\"146\" x2=\"474\" y2=\"146\" stroke=\"#D8DCE3\" stroke-width=\"1\"/><text x=\"380\" y=\"172\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600\" fill=\"#4A6CF7\" text-anchor=\"middle\">México: via abreviada</text><rect x=\"514\" y=\"40\" width=\"236\" height=\"150\" rx=\"10\" fill=\"#011072\" stroke=\"#011072\" stroke-width=\"1.5\"/><text x=\"632\" y=\"74\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700\" fill=\"#FFFFFF\" text-anchor=\"middle\">Reconhecimento</text><text x=\"632\" y=\"104.0\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400\" fill=\"#E3E8FF\" text-anchor=\"middle\">Aceita a decisão da outra</text><text x=\"632\" y=\"120.9\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13px;font-weight:400\" fill=\"#E3E8FF\" text-anchor=\"middle\">sem nova avaliação técnica</text><line x1=\"538\" y1=\"146\" x2=\"726\" y2=\"146\" stroke=\"#5566B8\" stroke-width=\"1\"/><text x=\"632\" y=\"172\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600\" fill=\"#FFFFFF\" text-anchor=\"middle\">Definição da guia COFEPRIS</text><line x1=\"20\" y1=\"20\" x2=\"730\" y2=\"20\" stroke=\"#6E7480\" stroke-width=\"2\"/><polygon points=\"740,20 728,14 728,26\" fill=\"#6E7480\"/><text x=\"20\" y=\"13\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:600\" fill=\"#6E7480\" text-anchor=\"start\">mais reavaliação pela autoridade local</text><text x=\"740\" y=\"13\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:600\" fill=\"#6E7480\" text-anchor=\"end\">menos reavaliação</text></svg><p class=\"apo-cap\">Quanto a autoridade local reavalia em cada forma de aproveitamento.</p></div><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Onde existe atalho de verdade</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:20.00%\"><col style=\"width:56.00%\"><col style=\"width:24.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PAÍS</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">ROTA</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">TIPO</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_mx\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">México</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Acordos de equivalência (FDA, Health Canada, Japão) + via abreviada</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Reliance</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_co\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Colômbia</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">CLV de origem ou de país de referência (art. 29 b); <a class=\"hot\" data-refs=\"invima\">Decreto 3275/2009</a> homologa documentos</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Evidência</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_co\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Colômbia (projeto)</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Análise otimizada para alto e muito alto risco; ANVISA entre as autoridades de referência (art. 80)</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Reliance, se aprovado</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_pe\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Peru</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">CE, <a class=\"hot\" data-refs=\"iso-13485\">ISO 13485</a> ou FDA no lugar do Certificado de BPM (todas as classes)</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Evidência</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_cl\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Chile</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Revisão documental do ISP, sem ensaios locais</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Sem reliance no decreto</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_ar\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Argentina</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Simplificação opcional para I e II (RTM Parte 3, item 13)</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Simplificação, não reliance</span></p></td></tr></table></div><div class=\"apo-box apo-fix\"><b class=\"k\">Para fixar</b><p>Entre os cinco países, só o México tem rota de reliance confirmada para dispositivos médicos.</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> art. 29 b; <a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a> arts. 2º e 7º; <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> Parte 3 item 13; <a class=\"hot\" data-refs=\"minsalud\">Proyecto de Decreto Régimen Sanitario de DM</a>, arts. 79 a 81</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">México: a via abreviada</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Os lineamientos da via regulatória abreviada foram publicados no DOF em 18/07/2025 e entraram em vigor 30 dias úteis depois, em 29/08/2025. Para dispositivos médicos, a COFEPRIS reconhece as decisões dos países do Management Committee do <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a> e usa os membros plenos do MDSAP para os certificados de boas práticas (art. 24). A resolução sai em até 30 dias úteis (art. 38), pelo trâmite <a class=\"hot\" data-refs=\"cofepris\">COFEPRIS-04-050</a>, com protocolo só físico (art. 26). O produto precisa ter características básicas essenciais idênticas às autorizadas pela autoridade de referência (art. 16). Os acordos de equivalência com FDA e Health Canada (2010) e com o Japão (2012) seguem vigentes.</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, Transitorio Primero e arts. 4, 16, 18, 20, 24, 26 e 38</span></p><div class=\"apo-box apo-caso\"><b class=\"k\">No estudo de caso</b><p>A ANVISA é autoridade de referência para a COFEPRIS, e a regularização brasileira pode abrir a via abreviada no México. Três cuidados: o registro ANVISA precisa ter saído pela via ordinária, e não por reliance ou via acelerada; precisa estar vigente durante todo o registro mexicano; e o produto precisa ser idêntico ao aprovado pela ANVISA. Variantes regionais de rotulagem, voltagem ou software são avaliadas antes de escolher a rota.</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, arts. 16, 18, 20 e 24</span></p><div class=\"apo-check\"><div class=\"ck\">Checagem rápida</div><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Qual é o prazo de resolução da via abreviada mexicana?</span></p><p class=\"opt\" data-q=\"apo:q7\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">15 dias úteis</span></p><p class=\"opt\" data-q=\"apo:q7\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Até 30 dias úteis</span></p><p class=\"opt\" data-q=\"apo:q7\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">60 dias</span></p><p class=\"opt\" data-q=\"apo:q7\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">90 días hábiles</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, art. 38</span></p></div><div class=\"apo-check\"><div class=\"ck\">Checagem rápida</div><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">O que caracteriza o aproveitamento de evidência?</span></p><p class=\"opt\" data-q=\"apo:q8\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A autoridade aceita a decisão estrangeira sem avaliar</span></p><p class=\"opt\" data-q=\"apo:q8\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Certificados estrangeiros entram no dossiê, mas tudo é reavaliado</span></p><p class=\"opt\" data-q=\"apo:q8\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A autoridade usa a avaliação de outra e decide</span></p><p class=\"opt\" data-q=\"apo:q8\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O processo de Classe I e II é simplificado</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, art. 4</span></p></div><div class=\"apo-check apo-an\"><div class=\"ck\">Análise de caso 6</div><p style=\"margin-top:0px;margin-bottom:6px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O cliente tem registro ANVISA obtido por uma via acelerada e quer usá-lo para pedir a via abreviada no México.</span></p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">A rota é elegível?</span></p><p class=\"opt\" data-q=\"apo:a6\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim: qualquer regularização na ANVISA serve</span></p><p class=\"opt\" data-q=\"apo:a6\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não: a via abreviada exige registro ANVISA pela via ordinária, vigente durante todo o registro mexicano, e produto idêntico</span></p><p class=\"opt\" data-q=\"apo:a6\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim, se o produto tiver certificado MDSAP</span></p><p class=\"opt\" data-q=\"apo:a6\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim, porque o Brasil é membro do IMDRF</span></p><details class=\"apo-why\"><summary>Ver justificativa</summary><p>A ANVISA é autoridade de referência para a COFEPRIS, mas a decisão de referência precisa ter saído pela via ordinária, e não por reliance ou via acelerada, e estar vigente durante todo o registro mexicano (arts. 16, 18 e 20).</p></details><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, arts. 16, 18 e 20</span></p></div><div class=\"apo-check apo-an\"><div class=\"ck\">Análise de caso 7</div><p style=\"margin-top:0px;margin-bottom:6px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A versão para o México terá rotulagem em espanhol e outra voltagem em relação ao modelo aprovado pela ANVISA.</span></p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">O que fazer antes de escolher a via abreviada?</span></p><p class=\"opt\" data-q=\"apo:a7\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Nada: diferenças regionais não importam</span></p><p class=\"opt\" data-q=\"apo:a7\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Avaliar se as características básicas essenciais continuam idênticas às autorizadas pela autoridade de referência; variantes de rotulagem, voltagem ou software são avaliadas antes da rota</span></p><p class=\"opt\" data-q=\"apo:a7\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Pedir reconhecimento automático</span></p><p class=\"opt\" data-q=\"apo:a7\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Trocar o titular</span></p><details class=\"apo-why\"><summary>Ver justificativa</summary><p>A via abreviada exige produto com características básicas essenciais idênticas às autorizadas pela autoridade de referência (art. 16). Por isso variantes regionais são avaliadas antes de escolher a rota.</p></details><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, art. 16</span></p></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Minhas anotações</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:100.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #D8DCE3;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #D8DCE3;border-right:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><textarea class=\"fld\" data-k=\"apo:n15\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:4.1px;font-size:5.4px\">&nbsp;</p>", "refs": ["cofepris", "dof", "mercosur", "invima", "minsalud", "bcn", "imdrf", "iso-13485"]}, {"id": "s7", "kicker": "PRÁTICA COM IA", "title": "Prática com IA", "ex": "IA", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">PRÁTICA COM IA</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#011072\">Prática com IA: montar e auditar o mapa</span></p><div class=\"apo-chips\"><span class=\"apo-chip\">No encontro: slides 28 a 31</span><span class=\"apo-chip ex\">Caderno: E4</span><span class=\"apo-chip ex\">Caderno: E5</span></div><div class=\"apo-box apo-fix\"><b class=\"k\">Regra do curso</b><p>A IA propõe: rascunho da matriz, sempre com norma e artigo. O profissional verifica: cada célula conferida no texto oficial. Sem artigo, não entra.</p></div><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Passo 1: rode o prompt (10 min)</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Copie o prompt abaixo e rode na ferramenta de IA que você usa hoje, sem dados confidenciais de cliente.</span></p><textarea class=\"promptbox\" readonly>Você é especialista em assuntos regulatórios de dispositivos médicos. Produto: equipamento eletromédico com software embarcado, Classe III na ANVISA (RDC 751/2022), com certificado MDSAP e aprovação FDA. Para México, Argentina, Colômbia, Peru e Chile, monte uma tabela com as colunas: (1) autoridade e marco legal vigente; (2) norma de classificação, regra e classe provável; (3) quem pode ser titular do registro; (4) rota de reliance disponível e tipo (reliance, reconhecimento ou aproveitamento de evidência). Em cada célula, cite a norma e o artigo. Se não tiver certeza, escreva &quot;não sei&quot; e indique a fonte oficial onde conferir. Não invente número de norma, artigo ou prazo.</textarea><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Passo 2: audite cada célula (10 min)</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:26.00%\"><col style=\"width:74.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">MARCAÇÃO</span></p></td><td colspan=\"1\" style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">QUANDO USAR</span></p></td></tr><tr><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Confirmada</span></p></td><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Bate com a norma e o artigo deste módulo</span></p></td></tr><tr><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Incorreta</span></p></td><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Contradiz a norma vigente</span></p></td></tr><tr><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Sem fonte</span></p></td><td colspan=\"1\" style=\"border-bottom:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Afirmação sem norma ou sem artigo</span></p></td></tr></table></div><div class=\"apo-box apo-alerta\"><b class=\"k\">O que procurar</b><p>Norma revogada (<a class=\"hot\" data-refs=\"anmat\">Disp. 2318/02</a>, <a class=\"hot\" data-refs=\"anmat\">Disp. 1285/04</a> ou <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 40/00</a>), lista chilena sem o <a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a> e o projeto colombiano tratado como se já estivesse vigente.</p></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Meu placar</span></p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">1. </span><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Células confirmadas</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:100.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #D8DCE3;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #D8DCE3;border-right:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><textarea class=\"fld\" data-k=\"apo:ia1\" rows=\"1\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:4.1px;font-size:5.4px\">&nbsp;</p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">2. </span><span style=\"font-weight:700;font-size:14.3px;color:#011072\ const HSC=(function(){
  const $=s=>document.querySelector(s);
  const ORGC={ANVISA:"--org-anvisa",IMDRF:"--org-imdrf",TGA:"--org-tga",FDA:"--org-fda",HC:"--org-hc",PMDA:"--org-pmda",ISO:"--org-iso",MDSAP:"--org-mdsap"};
  const orgColor=o=>`var(${ORGC[o]||"--org-outro"})`;
  const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const RX=RULES.map(([p,id])=>[new RegExp(p,"g"),id]);

  /* transforma citações do texto em links clicáveis */
  function linkify(text){
    let s=esc(text); const marks=[];
    RX.forEach(([rx,id])=>{ rx.lastIndex=0; let m; const src=s;
      while((m=rx.exec(src))){ marks.push({a:m.index,b:m.index+m[0].length,id}); if(!m[0].length) rx.lastIndex++; } });
    marks.sort((x,y)=>x.a-y.a||y.b-x.b);
    let out="",pos=0;
    for(const k of marks){ if(k.a<pos) continue; out+=s.slice(pos,k.a)+`<a class="hot" data-refs="${k.id}">${s.slice(k.a,k.b)}</a>`; pos=k.b; }
    return out+s.slice(pos);
  }
  function refCard(id,withUrl){
    const r=REFS[id]; if(!r) return "";
    return `<div class="ref" data-open="${id}"><span class="org" style="background:${orgColor(r.org)}">${r.org==="Outro"?"REF":r.org}</span><div><div class="t">${esc(r.t)}</div><div class="d">${esc(r.d||"")}</div>${withUrl?`<div class="u">${esc(r.url)}</div>`:""}</div></div>`;
  }
  function openRefs(ids){
    ids=[...new Set(ids)].filter(id=>REFS[id]); if(!ids.length) return;
    $("#refTitle").textContent=ids.length>1?"Fontes citadas neste trecho":"Abrir fonte oficial";
    $("#refList").innerHTML=ids.map(id=>refCard(id,true)).join("");
    $("#refModal").classList.add("open");
  }
  function modalsHTML(){
    return `<div class="modal" id="refModal"><div class="card"><h3 id="refTitle">Abrir fonte oficial</h3>
      <p class="hint">Clique para abrir em nova aba. Os sites oficiais não permitem exibição dentro da plataforma.</p>

      <div class="wm" id="wm"></div><div class="toast" id="toast"></div>
      <div class="lock" id="lock"><div><img src="${ASSETS.logoWhite}" alt="HSC Global"><h2>Disponível somente na HSC Academy</h2>
      <p>Este material só pode ser aberto dentro da plataforma learning.academy.hscglobal.com.br.</p></div></div>`;
  }

  /* armazenamento local seguro (anotações e respostas do aluno) */
  const store={
    get(k,d){ try{ const v=localStorage.getItem("hsc:"+CONFIG.codigoBase+":"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
    set(k,v){ try{ localStorage.setItem("hsc:"+CONFIG.codigoBase+":"+k,JSON.stringify(v)); return true;}catch(e){return false;} }
  };

  let tt; function toast(m){ const t=$("#toast"); if(!t) return; t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

  function hostOk(){
    if(CONFIG.modoTeste) return true;
    const ok=h=>CONFIG.dominiosPermitidos.some(d=>h===d||h.endsWith("."+d));
    let framed=true; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
    if(!framed) return false;
    let anc=""; try{ if(location.ancestorOrigins&&location.ancestorOrigins.length) anc=location.ancestorOrigins[location.ancestorOrigins.length-1]; }catch(e){}
    if(!anc) anc=document.referrer;
    try{ return ok(new URL(anc).hostname); }catch(e){ return false; }
  }

  /* marca d'água discreta no canto inferior direito: não cobre o conteúdo, aparece por cima de slides, painéis e janelas */
  function watermark(){
    const p=new URLSearchParams(location.search);
    const who=p.get("u")||CONFIG.marcaDagua;
    const box=$("#wm"); if(!box) return;
    const draw=()=>{ const stamp=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
      box.innerHTML=`<span class="wm-dot"></span>${esc(who)} - ${stamp}`;
      document.querySelectorAll(".swm").forEach(s=>s.textContent=`${who} - ${stamp}`);
      requestAnimationFrame(()=>document.body.style.setProperty("--wmw",(box.offsetWidth+30)+"px")); };
    draw(); setTimeout(draw,0); setInterval(draw,60000);
  }
  function protect(onKey){
    document.addEventListener("contextmenu",e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); });
    document.addEventListener("keydown",e=>{
      const k=(e.key||"").toLowerCase(), m=e.ctrlKey||e.metaKey, typing=/TEXTAREA|INPUT/.test(e.target.tagName);
      const copyKeys=typing?["s","p","u"]:["s","p","c","u","a","x"];
      if((m&&copyKeys.includes(k))||(m&&e.shiftKey&&["i","j","c","s"].includes(k))||k==="f12"||k==="printscreen"){
        e.preventDefault(); e.stopPropagation(); toast("Material protegido: download, cópia e impressão desativados."); return; }
      if(typing) return;
      if(k==="escape") document.querySelectorAll(".modal.open").forEach(x=>x.classList.remove("open"));
      onKey&&onKey(e,k);
    },true);
    ["copy","cut","dragstart"].forEach(ev=>document.addEventListener(ev,e=>{ if(!/TEXTAREA|INPUT/.test(e.target.tagName)) e.preventDefault(); }));
    document.addEventListener("keyup",e=>{ if(e.key==="PrintScreen"){ try{navigator.clipboard.writeText("")}catch(_){} } });
    document.addEventListener("click",e=>{
      const o=e.target.closest("[data-open]"); if(o){ e.preventDefault(); window.open(REFS[o.dataset.open].url,"_blank","noopener"); return; }
      const z=e.target.closest("[data-refs]"); if(z){ e.preventDefault(); openRefs(z.dataset.refs.split(",")); return; }
      const c=e.target.closest("[data-close]"); if(c){ c.closest(".modal").classList.remove("open"); return; }
      if(e.target.classList.contains("modal")) e.target.classList.remove("open");
    });
  }

  function boot(onKey){
    document.body.insertAdjacentHTML("beforeend",modalsHTML());
    $("#lock").style.backgroundImage=`url(${ASSETS.bg})`;
    if(!hostOk()){ $("#lock").classList.add("open"); document.querySelectorAll("[data-app]").forEach(e=>e.remove()); return false; }
    protect(onKey); watermark(); return true;
  }

  /* ---------- exercício: professor vê a referência; aluno responde e confere ---------- */
  function exerciseHTML(ex,mode){
    const saved=store.get("ex:"+ex.id,{});
    const qs=ex.perguntas.map((q,i)=>{
      const key=ex.id+"-"+i;
      if(mode==="professor") return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <div class="qrow"><span></span><button class="btn" data-reveal="${key}">Mostrar resposta de referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
      return `<div class="q"><div class="qt">${i+1}. ${linkify(q.p)}</div>
        <textarea data-ans="${key}" placeholder="Escreva sua resposta aqui antes de conferir.">${esc(saved[i]||"")}</textarea>
        <div class="qrow"><span class="saved" id="sv-${key}">${saved[i]?"Resposta salva neste navegador":""}</span>
        <button class="btn pri" data-reveal="${key}" ${saved[i]?"":"disabled"}>Conferir com a referência</button></div>
        <div class="ans" id="ans-${key}"><b>Resposta de referência</b>${linkify(q.r)}</div></div>`;
    }).join("");
    return `<div class="ex-head"><div class="ex-id">${ex.id}</div><div><div class="ex-kicker">${esc(ex.bloco)}</div>
      <div class="ex-title">${esc(ex.titulo)}</div><div class="ex-meta"><span class="chip"><i class="ic ic-hora"></i> ${esc(ex.modo)}</span><span class="chip"><i class="ic ic-doc"></i> ${esc(ex.deck)}</span></div></div></div>
      <div class="ex-cen"><b>Cenário</b>${linkify(ex.cenario)}</div>${qs}<div class="fonte">${linkify(ex.fonte)}</div>`;
  }
  function wireExercise(root,ex){
    root.querySelectorAll("[data-reveal]").forEach(b=>b.onclick=()=>{
      const a=root.querySelector("#ans-"+b.dataset.reveal); const on=a.classList.toggle("show");
      if(b.classList.contains("pri")) b.textContent=on?"Ocultar referência":"Conferir com a referência";
      else b.textContent=on?"Ocultar resposta de referência":"Mostrar resposta de referência";
    });
    root.querySelectorAll("textarea[data-ans]").forEach(t=>{
      let timer; t.oninput=()=>{ const [id,i]=t.dataset.ans.split(/-(?=\d+$)/);
        const btn=root.querySelector(`[data-reveal="${t.dataset.ans}"]`); btn.disabled=t.value.trim().length<3;
        clearTimeout(timer); timer=setTimeout(()=>{ const s=store.get("ex:"+id,{}); s[i]=t.value; const ok=store.set("ex:"+id,s);
          const sv=root.querySelector("#sv-"+t.dataset.ans); if(sv) sv.textContent=ok?"Resposta salva neste navegador":"Não foi possível salvar neste navegador"; },400); };
    });
  }
  /* ---------- documentos convertidos do .docx: campos e alternativas ---------- */
  function wireDoc(root,mode,feedback,onChange,imgs){
    const PROF=mode==="professor", ans=()=>store.get("doc",{});
    root.querySelectorAll("img[data-img]").forEach(i=>{ if(imgs&&imgs[i.dataset.img]) i.src=imgs[i.dataset.img]; });
    const a=ans();
    root.querySelectorAll("textarea.fld").forEach(t=>{ if(PROF){ t.readOnly=true; t.placeholder=""; return; } t.value=a[t.dataset.k]||""; let tm;
      t.oninput=()=>{ clearTimeout(tm); tm=setTimeout(()=>{ const s=ans(); s[t.dataset.k]=t.value; if(!store.set("doc",s)) toast("Não foi possível salvar neste navegador"); onChange&&onChange(); },400); }; });
    const mark=(q,letter)=>root.querySelectorAll(`.opt[data-q="${q}"]`).forEach(x=>{ x.classList.remove("sel","fb-ok","fb-bad");
      if(feedback){ if(x.dataset.ok) x.classList.add("fb-ok"); else if(x.dataset.o===letter) x.classList.add("fb-bad"); }
      else if(x.dataset.o===letter) x.classList.add("sel"); });
    if(!PROF) root.querySelectorAll(".opt[data-q]").forEach(o=>{ const q=o.dataset.q;
      if(a[q]===o.dataset.o) mark(q,o.dataset.o);
      o.onclick=()=>{ if(feedback&&ans()[q]) return; const s=ans(); s[q]=o.dataset.o; store.set("doc",s); mark(q,o.dataset.o); onChange&&onChange(); }; });
  }
  return {$,esc,linkify,refCard,openRefs,store,toast,boot,exerciseHTML,wireExercise,wireDoc,orgColor};
})();

(function(){
  const {$,esc,store,toast}=HSC;
  const PROF=CONFIG.modo==="professor";
  if(!HSC.boot()) return;
  document.body.classList.toggle("prof",PROF);
  $("#heroPh").style.backgroundImage=`url(${ASSETS.heroFoto})`;
  $("#logo").src=ASSETS.logoWhite; $("#flogo").src=ASSETS.logoNavy; $("#s1").src=ASSETS.mdsap; $("#s2").src=ASSETS.exemplar;
  $("#badge").textContent=PROF?"Uso exclusivo do instrutor":"Material do aluno"; $("#badge").className="badge "+(PROF?"prof":"alu");
  $("#k").textContent=DOC.kicker; $("#h1").textContent=DOC.titulo; $("#sub").textContent=DOC.sub; $("#fcode").textContent=CONFIG.codigo;
  const ans=()=>store.get("doc",{});
  function secDone(s){ const a=ans(); const ks=[...s.html.matchAll(/data-k="([^"]+)"/g)].map(m=>m[1]).concat([...new Set([...s.html.matchAll(/data-q="([^"]+)"/g)].map(m=>m[1]))]);
    return ks.length>0 && ks.every(k=>(a[k]||"").toString().trim().length>1 || (a[k]&&k.includes(":q"))); }
  function toc(cur){
    $("#toc").innerHTML=`<h4>${esc(DOC.toc)}</h4>`+SECS.map((s,i)=>`<a data-go="${i}" class="${i===cur?"on":""}"><b>${esc(s.ex||String(i+1))}</b><span>${esc(s.title||s.kicker)}</span>${!PROF&&secDone(s)?'<span class="dn">✓</span>':""}</a>`).join(""); }
  function fill(root){ HSC.wireDoc(root,CONFIG.modo,CONFIG.feedback,()=>toc(cur),IMGS); }
  let cur=0;
  function show(i){ cur=Math.max(0,Math.min(SECS.length-1,i)); toc(cur); const s=SECS[cur];
    $("#page").innerHTML=s.html+`<div class="navx">${cur>0?`<button class="btn" data-go="${cur-1}">← Anterior</button>`:"<span></span>"}${cur<SECS.length-1?`<button class="btn pri" data-go="${cur+1}">Próxima →</button>`:"<span></span>"}</div>`+
      (PROF?"":`<div class="saveinfo">Suas respostas ficam salvas neste navegador.</div>`);
    fill($("#page")); try{ history.replaceState(null,"","#"+(s.ex||cur+1)); }catch(e){} }
  document.addEventListener("click",e=>{ const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); show(+g.dataset.go); scrollTo({top:$(".layout").offsetTop-10,behavior:"smooth"}); } });
  const h=decodeURIComponent(location.hash.slice(1)); let start=SECS.findIndex(s=>s.ex===h); if(start<0) start=(parseInt(h)||1)-1; show(start);
})();
</script>
</body>
