:root{
  --navy:#011072; --navy-2:#000B4A; --night:#06091F; --accent:#4A6CF7; --accent-2:#3B5BDB;
  --ice:#EEF2FE; --ink:#171717; --muted:#6E7480; --line:#DDE3F3; --ok:#12805C; --ok-bg:#E6F6EF;
  --bad:#B42318; --bad-bg:#FDECEA; --gold:#E0A526; --panel:#0B1450; --panel-ink:#E8ECFB;
  --org-anvisa:#1351B4; --org-imdrf:#0E7C86; --org-tga:#7A3E9D; --org-fda:#B4232A;
  --org-hc:#C8102E; --org-pmda:#2E6B30; --org-iso:#4A4A4A; --org-mdsap:#011072; --org-outro:#555;
  --font:"Blauer Nue","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
textarea,input{-webkit-user-select:text;user-select:text;font-family:var(--font)}
img{-webkit-user-drag:none}
button{font-family:var(--font)}
.hot{display:inline;color:var(--accent-2);font-weight:600;cursor:pointer;border-bottom:1px dashed currentColor;text-decoration:none}
.hot:hover{color:var(--navy)}
.org{font-size:10px;font-weight:700;color:#fff;padding:3px 6px;border-radius:4px;min-width:58px;text-align:center;flex:none;letter-spacing:.04em}
.ref{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:8px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;font-size:13px;line-height:1.4}
.ref:hover{border-color:var(--accent)}
.ref .t{font-weight:600}
.ref .d{opacity:.72;font-size:12px}
.ref .u{font-size:11px;opacity:.65;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(3,6,30,.62);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.card{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px 22px;color:var(--ink);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card.wide{max-width:860px}
.card h3{margin:0 0 4px;color:var(--navy);font-size:18px}
.card .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.card .ref{background:var(--ice)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* exercício */
.ex-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.ex-id{background:var(--navy);color:#fff;font-weight:700;border-radius:10px;padding:10px 12px;font-size:18px;line-height:1}
.ex-kicker{color:var(--accent);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.ex-title{font-size:20px;color:var(--navy);font-weight:700;margin:2px 0 4px}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--ice);color:var(--navy);padding:3px 9px;border-radius:20px}
.ex-cen{background:var(--ice);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0 14px;font-size:14.5px;line-height:1.55}
.ex-cen b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.q .qt{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px;line-height:1.4}
.q textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;resize:vertical;line-height:1.45}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.ans{display:none;margin-top:10px;background:var(--ok-bg);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.55;color:#0b3b2b}
.ans b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ok);margin-bottom:3px}
.ans.show{display:block}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted)}
.fonte{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
/* proteção */
/* marca d'água no canto: identifica quem está vendo sem cobrir texto nem imagens */
.wm{position:fixed;right:14px;bottom:14px;z-index:70;pointer-events:none;display:flex;align-items:center;gap:7px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:rgba(255,255,255,.92);background:rgba(0,11,74,.72);
  border:1px solid rgba(255,255,255,.18);padding:5px 10px;border-radius:20px;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.wm .wm-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
body.has-bar .wm{bottom:13px;background:rgba(0,0,0,.25)}
.lock{position:fixed;inset:0;background:var(--navy-2) center/cover no-repeat;color:#fff;z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
.lock.open{display:flex}
.lock img{height:34px;margin-bottom:22px}
.lock h2{margin:0 0 8px;font-weight:600}
.lock p{opacity:.8;max-width:460px;margin:0 auto;line-height:1.5}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 15px;border-radius:8px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media print{ body *{display:none!important} body::before{content:"Material protegido - HSC Academy. Impressão não autorizada.";display:block!important;padding:40px;font-size:20px;color:#000} }

.ic{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
img.flag{width:1.25em;height:1.25em;vertical-align:-.25em;margin-right:.45em;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.sec-photo{background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.55) 30%,#000 70%);opacity:.92}

/* documentos (.docx) dentro de páginas e modais */
.docx p,.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.docx p.emp,.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok,.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}

body{background:#F4F6FC;color:var(--ink)}
.hero{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--navy-2) 0%,var(--navy) 100%);color:#fff;padding:24px 0 34px}
.hero .ph{position:absolute;right:0;top:0;bottom:0;width:min(46%,760px);background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);opacity:.85}
.hero .wrapc{position:relative}
.wrapc{max-width:1120px;margin:0 auto;padding:0 20px}
.hero .bar{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.hero .bar img{height:22px}
.hero .bar .sep{width:1px;height:22px;background:rgba(255,255,255,.3)}
.hero .bar span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.hero .bar .badge{margin-left:auto;font-weight:700;font-size:10.5px;padding:4px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.badge.prof{background:var(--gold);color:#1a1a1a}
.badge.alu{background:rgba(255,255,255,.14);color:#fff}
.hero .k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:32px;font-weight:600;margin:10px 0 6px;line-height:1.15}
.hero .sub{font-size:18px;opacity:.9}
.hero .seals{display:flex;gap:14px;margin-top:18px;align-items:center}
.hero .seals img{height:58px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:22px;padding:24px 0 70px}
.toc{position:sticky;top:14px;align-self:start;background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(1,16,114,.06);padding:12px;max-height:calc(100vh - 28px);overflow:auto}
.toc h4{margin:4px 8px 8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.toc a{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13.5px;color:var(--ink);text-decoration:none;cursor:pointer;line-height:1.3}
.toc a:hover{background:var(--ice)}
.toc a.on{background:var(--navy);color:#fff}
.toc a b{font-size:11px;min-width:26px;color:var(--accent)}
.toc a.on b{color:#9DB1FF}
.toc a .dn{margin-left:auto;color:var(--ok);font-size:12px}
.page{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(1,16,114,.06);padding:30px 36px;min-width:0}
.page p{margin:0 0 4px;line-height:1.45;white-space:pre-wrap}
.page p.emp{line-height:1}
.tw{overflow-x:auto;margin:2px 0 8px}
table.dt{border-collapse:collapse;table-layout:fixed}
table.dt td{vertical-align:top}
table.dt td p{margin:0 0 2px}
.fld{display:block;width:100%;border:1px dashed #AAB5E6;background:#F8F9FF;border-radius:6px;padding:8px 10px;font-size:14px;line-height:1.45;resize:vertical;margin-top:4px;color:var(--ink)}
.fld:focus{outline:2px solid var(--accent);border-style:solid;background:#fff}
.opt{cursor:pointer;border:1px solid transparent;border-radius:8px;padding:4px 8px!important;margin:2px 0!important;transition:.12s}
.opt:hover{border-color:var(--line);background:var(--ice)}
.opt.sel{border-color:var(--accent);background:#EEF2FE}
.opt.opt-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.fb-bad{background:var(--bad-bg);border-color:var(--bad)}
.prof .opt{cursor:default}
.navx{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.saveinfo{font-size:12px;color:var(--muted);margin-top:14px}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px 20px 30px;line-height:1.6}
footer img{height:18px;display:block;margin:0 auto 8px}
@media (max-width:860px){ .layout{grid-template-columns:1fr} .toc{position:static;max-height:none} .page{padding:20px 16px} .hero h1{font-size:25px} }
.footbar{position:fixed;left:0;right:0;bottom:0;height:40px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:30;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body{padding-bottom:44px}
.wm{bottom:7px!important}
.hero .seals{display:none}

.apo-dg{margin:10px 0 6px}.apo-cap{font-size:12px;color:#6E7480;margin:2px 0 8px!important}
.apo-why{margin:6px 0 4px;font-size:13.6px}.apo-why summary{cursor:pointer;color:#4A6CF7;font-weight:600}.apo-why p{margin:6px 0 2px!important;line-height:1.5}
table.apo-map textarea.fld{min-height:84px;font-size:13px}
table.apo-map .opt{padding:2px 4px!important}
.apo-chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
.apo-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:#F0F2FF;color:#011072;padding:4px 10px;border-radius:20px}
.apo-chip.ex{background:#011072;color:#fff}
.apo-box{border-radius:8px;padding:12px 16px;margin:12px 0 14px;line-height:1.5;font-size:14.3px}
.apo-box b.k{display:block;font-size:10.9px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.apo-fix{background:#F0F2FF;border-left:4px solid #4A6CF7}.apo-fix b.k{color:#4A6CF7}
.apo-alerta{background:#FFF7E6;border-left:4px solid #E0A526}.apo-alerta b.k{color:#9A6B00}
.apo-caso{background:#fff;border:1.5px solid #011072}.apo-caso b.k{color:#011072}
.apo-box p{margin:0 0 4px!important}
.apo-check{border:1px solid #DDE3F3;border-radius:10px;padding:12px 14px 6px;margin:14px 0}
.apo-check .ck{font-size:10.9px;letter-spacing:2px;text-transform:uppercase;color:#4A6CF7;font-weight:600;margin-bottom:6px}
textarea.promptbox{width:100%;min-height:190px;border:1px solid #AAB5E6;border-radius:8px;background:#F8F9FF;padding:10px 12px;font-size:13.6px;line-height:1.5;color:#171717;resize:vertical}
img.flag{width:18px;height:18px;vertical-align:-4px;margin-right:6px;border-radius:50%}
.apo-check.apo-an{border:1.5px solid #011072;background:#FBFCFF}.apo-check.apo-an .ck{color:#011072}

</style>
</head>

const SECS=[{"id": "s0", "kicker": "REGISTRO DE DM NA LATAM COM IA", "title": "Como usar e o estudo de caso", "ex": null, "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">REGISTRO DE DM NA LATAM COM IA</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:700;font-size:27.2px;color:#011072\">Módulo 1: Arquitetura regulatória LATAM comparada</span></p><p style=\"margin-top:0px;margin-bottom:16.3px\"><span style=\"font-weight:700;font-size:19.0px;color:#011072\">Apostila do aluno</span></p><div class=\"apo-chips\"><span class=\"apo-chip\">No encontro: slides 1 a 3</span></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Esta apostila é o seu material de estudo do Encontro 1. Ela não repete os slides: começa por uma matriz-síntese dos seis países, explica cada bloco em texto corrido com esquemas, destaca o que fixar e o que costuma dar errado, e traz dois tipos de atividade: checagens rápidas, para conferir se você fixou o essencial, e análises de caso, em que você decide diante de uma situação de cliente.</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Cada seção mostra os slides do encontro a que corresponde e o exercício do Caderno que pratica aquele bloco. No fim, você monta o seu mapa do estudo de caso, que é o entregável do módulo.</span></p><p style=\"margin-top:0px;margin-bottom:13.6px\"><span style=\"font-weight:400;font-size:10.9px;color:#6E7480\">Material de uso exclusivo para treinamento da HSC Global Group. É proibida a reprodução, total ou parcial, por qualquer meio, sem autorização prévia e por escrito. Todos os direitos reservados à HSC Global Group, conforme registro no INPI.</span></p><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7 \">Regra do curso</b><p>A IA propõe, o profissional verifica. Nenhuma afirmação regulatória vai para um dossiê sem norma e artigo conferidos por uma pessoa.</p></div>", "refs": []}, {"id": "s1", "kicker": "MATRIZ-SÍNTESE", "title": "Os seis países numa página", "ex": "S", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">MATRIZ-SÍNTESE</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#011072\">Os seis países numa página</span></p><div class=\"apo-chips\"><span class=\"apo-chip\">No encontro: slides 4 a 27</span></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Esta é a página de consulta do módulo: autoridade, escala de classificação, quem pode ser titular e a forma mais curta de aproveitar uma aprovação estrangeira em cada país. Os detalhes e as fontes estão nas seções 1.1 a 1.5.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:13.00%\"><col style=\"width:12.00%\"><col style=\"width:18.00%\"><col style=\"width:31.00%\"><col style=\"width:26.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PAÍS</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">AUTORIDADE</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">CLASSIFICAÇÃO</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">QUEM PODE SER TITULAR</spa <span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"anvisa\">RDC 751/2022</a> art. 67; <a class=\"hot\" data-refs=\"anmat\">Disp. ANMAT 64/2025</a>; <a class=\"hot\" data-refs=\"dof\">Acuerdo DOF 18/07/2025</a>, Transitorio Primero; <a class=\"hot\" data-refs=\"dof\">NOM-241-SSA1-2025</a> cap. 23; <a class=\"hot\" data-refs=\"minsalud\">Proyecto de Decreto Régimen Sanitario de DM</a>; <a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a>, transitórios; Decreto de reforma do <a class=\"hot\" data-refs=\"dof\">RIS</a>, DOF 24/04/2026</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Três lógicas de controle</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Em cinco dos seis países (Brasil, México, Argentina, Colômbia e Peru), todo dispositivo médico precisa de autorização antes de ser vendido, e o nível de exigência cresce com a classe: documentos, evidência clínica e prazo aumentam com o risco.</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O Chile é diferente. O <a class=\"hot\" data-refs=\"bcn\">DS 825</a> prevê quatro classes, mas o artigo 22 diz que a aplicação é progressiva, por decreto do Ministério da Saúde com informe prévio do ISP. Só é obrigatório o que um decreto incorpora à lista.</span></p><div class=\"apo-dg\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 300\" width=\"100%\" role=\"img\" aria-label=\"Decisão no Chile: controle por lista\" style=\"max-width:760px;display:block;margin:6px 0 4px\"><rect x=\"180\" y=\"10\" width=\"400\" height=\"74\" rx=\"12\" fill=\"#011072\"/><text x=\"380\" y=\"40.0\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700\" fill=\"#FFFFFF\" text-anchor=\"middle\">O produto está num decreto de controle?</text><text x=\"380\" y=\"59.5\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:15px;font-weight:700\" fill=\"#FFFFFF\" text-anchor=\"middle\">(ex.: os 39 itens do Decreto Exento 25/2026)</text><path d=\"M260 84 V112 H130 V136\" fill=\"none\" stroke=\"#6E7480\" stroke-width=\"2\"/><polygon points=\"130,144 124,132 136,132\" fill=\"#6E7480\"/><path d=\"M500 84 V112 H630 V136\" fill=\"none\" stroke=\"#4A6CF7\" stroke-width=\"2\"/><polygon points=\"630,144 624,132 636,132\" fill=\"#4A6CF7\"/><text x=\"200\" y=\"106\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:700\" fill=\"#6E7480\" text-anchor=\"middle\">NÃO</text><text x=\"560\" y=\"106\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:12px;font-weight:700\" fill=\"#4A6CF7\" text-anchor=\"middle\">SIM</text><rect x=\"10\" y=\"146\" width=\"240\" height=\"108\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D8DCE3\" stroke-width=\"1.5\"/><text x=\"130\" y=\"178.0\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">Registro no ISP</text><text x=\"130\" y=\"195.55\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">não é obrigatório</text><text x=\"130\" y=\"213.1\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">Aplicação progressiva</text><text x=\"130\" y=\"230.65\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">(DS 825, art. 22)</text><rect x=\"400\" y=\"146\" width=\"350\" height=\"108\" rx=\"10\" fill=\"#F0F2FF\" stroke=\"#4A6CF7\" stroke-width=\"1.5\"/><text x=\"575\" y=\"176.0\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">A classe do DS 825 define os requisitos</text><text x=\"575\" y=\"193.55\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">(art. 21) e o registro passa a valer</text><text x=\"575\" y=\"211.1\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">no prazo de transição: 24 meses</text><text x=\"575\" y=\"228.65\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:13.5px;font-weight:400\" fill=\"#171717\" text-anchor=\"middle\">(Classe IV e outros) ou 36 meses</text><text x=\"380\" y=\"284.0\" style=\"font-family:'Blauer Nue',Helvetica,Arial,sans-serif;font-size:14px;font-weight:700\" fill=\"#011072\" text-anchor=\"middle\">No Chile, a primeira pergunta não é qual é a classe, e sim se o produto está na lista.</text></svg><p class=\"apo-cap\">Como decidir no Chile.</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"bcn\">DS 825/1998</a> arts. 1, 3, 20, 21 e 22; <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> art. 1; <a class=\"hot\" data-refs=\"mercosur\">RTM MERCOSUR</a> Parte 3 item 1</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Chile: a lista cresceu em 2026</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O <a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a>, assinado em 06/03/2026 e publicado em 19/03/2026, incorporou 39 itens ao controle sanitário: 5 diagnósticos in vitro, 2 softwares oncológicos e 32 dispositivos das classes II a IV, entre eles marcapassos, stents, tomógrafos, mamógrafos, ventiladores e eletrobisturi.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:18.00%\"><col style=\"width:56.00%\"><col style=\"width:26.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PRAZO</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PARA QUEM</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">ATÉ</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">24 meses</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Classe IV, bombas de insulina e bolsas de sangue</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">19/03/2028</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">36 meses</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Os outros 26 itens, incluindo DIV e SaMD</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">19/03/2029</span></p></td></tr></table></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">As normas-base são a NCh ISO 16142-1 e -2, a <a class=\"hot\" data-refs=\"iso-13485\">NCh ISO 13485</a> e a NCh ISO 14971, mais normas por produto. O ISP publica o instrutivo técnico em até 12 meses; depois dele, quem quiser pode pedir o registro antes do prazo.</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a> art. 1º, art. 2º e arts. 1º a 3º transitórios; nota do ISP de 20/03/2026</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Argentina e Colômbia em transição</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Na Argentina, a <a class=\"hot\" data-refs=\"anmat\">Disp. ANMAT 64/2025</a> incorporou a <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> e revogou a <a class=\"hot\" data-refs=\"anmat\">Disp. 2318/02</a>, referência por quase vinte anos, e a <a class=\"hot\" data-refs=\"anmat\">Disp. 1285/04</a>. A vigência MERCOSUR conta 30 dias após a comunicação de que todos os Estados incorporaram (art. 2º). A <a class=\"hot\" data-refs=\"anmat\">Disp. ANMAT 4446/2025</a> deixou de exigir autorização prévia para importar produtos Classe I e II trazidos por estabelecimentos habilitados: o registro continua exigido, e o importador envia um aviso de importação via TAD em até 48 horas.</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Na Colômbia, segue vigente o <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a>, com os Decretos 582/2017 e 3275/2009. Em dezembro de 2025, o Ministério da Saúde publicou um projeto de decreto único para dispositivos médicos e diagnóstico in vitro, que revoga os Decretos 4725/2005 e 3770/2004 e só entra em vigor 18 meses depois de publicado.</span></p><div class=\"apo-box apo-alerta\"><b class=\"k\">Atenção</b><p>Material que ainda cita a <a class=\"hot\" data-refs=\"anmat\">Disp. 2318/02</a> está desatualizado. E o projeto colombiano é projeto: até entrar em vigor, vale o <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a>.</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"anmat\">Disp. ANMAT 64/2025</a> arts. 1º a 3º; <a class=\"hot\" data-refs=\"anmat\">Disp. ANMAT 4446/2025</a> arts. 1º a 5º; <a class=\"hot\" data-refs=\"minsalud\">Proyecto de Decreto Régimen Sanitario de DM</a> (MinSalud, dez/2025), arts. 177 a 179</span></p><div class=\"apo-check\"><div class=\"ck\">Checagem rápida</div><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Em qual país o registro só é obrigatório para o que um decreto incorpora à lista de controle?</span></p><p class=\"opt\" data-q=\"apo:q1\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">México</span></p><p class=\"opt\" data-q=\"apo:q1\" data-o=\"b\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Peru</span></p><p class=\"opt\" data-q=\"apo:q1\" data-o=\"c\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Chile</span></p><p class=\"opt\" data-q=\"apo:q1\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Colômbia</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"bcn\">DS 825/1998</a>, art. 22</span></p></div><div class=\"apo-check\"><div class=\"ck\">Checagem rápida</div><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Qual norma argentina foi revogada pela <a class=\"hot\" data-refs=\"anmat\">Disp. ANMAT 64/2025</a>?</span></p><p class=\"opt\" data-q=\"apo:q2\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Disp. ANMAT 4446/2025</span></p><p class=\"opt\" data-q=\"apo:q2\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Disp. 2318/02</span></p><p class=\"opt\" data-q=\"apo:q2\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Res. GMC 25/21</span></p><p class=\"opt\" data-q=\"apo:q2\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Decreto 4725/2005</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"anmat\">Disp. ANMAT 64/2025</a>, art. 3º</span></p></div><div class=\"apo-check apo-an\"><div class=\"ck\">Análise de caso 1</div><p style=\"margin-top:0px;margin-bottom:6px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Um cliente exporta tomógrafos para o Chile e afirma que não precisa de registro no ISP, porque o país &quot;só controla o que está na lista&quot;.</span></p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Como você avalia a afirmação?</span></p><p class=\"opt\" data-q=\"apo:a1\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Está correta: tomógrafos nunca foram controlados no Chile</span></p><p class=\"opt\" data-q=\"apo:a1\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Está desatualizada: tomógrafos estão entre os dispositivos incorporados pelo Decreto Exento 25/2026, e o registro passa a ser exigido no prazo de transição</span></p><p class=\"opt\" data-q=\"apo:a1\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Está correta, desde que o cliente tenha certificado MDSAP</span></p><p class=\"opt\" data-q=\"apo:a1\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Está correta até o projeto colombiano entrar em vigor</span></p><details class=\"apo-why\"><summary>Ver justificativa</summary><p>A lógica de lista está certa, mas a lista mudou: o <a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a> incorporou 32 dispositivos das classes II a IV, entre eles tomógrafos, com prazo de 24 ou 36 meses contados de 19/03/2026. O MDSAP não substitui o registro, e a norma colombiana não se aplica ao Chile.</p></details><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a>, art. 1º e arts. 1º a 3º transitórios; <a class=\"hot\" data-refs=\"bcn\">DS 825/1998</a>, art. 22</span></p></div><div class=\"apo-box apo-caso\"><b class=\"k\">No estudo de caso</b><p>Discussão do slide 8 (Caderno, E1): qual destas mudanças mais afeta um portfólio que hoje exporta do Brasil para a região, a lista chilena, a nova base argentina ou o regime colombiano?</p></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Minhas anotações</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:100.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #D8DCE3;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #D8DCE3;border-right:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><textarea class=\"fld\" data-k=\"apo:n11\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:4.1px;font-size:5.4px\">&nbsp;</p>", "refs": ["anvisa", "dof", "anmat", "mercosur", "invima", "minsalud", "digemid", "bcn", "iso-13485"]}, {"id": "s3", "kicker": "SEÇÃO 1.2", "title": "Classificação comparada", "ex": "1.2", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">SEÇÃO 1.2</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#011072\">Classificação comparada</span></p><div class=\"apo-chips\"><span class=\"apo-chip\">No encontro: slides 9 a 14</span><span class=\"apo-chip ex\">Caderno: E2</span></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Quatro países usam quatro níveis, a Colômbia usa quatro níveis com nomenclatura europeia e o México comprime tudo em três. Brasil e Argentina têm as mesmas 22 regras; Colômbia e Peru têm 18, na lógica europeia e do GHTF.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:18.00%\"><col style=\"width:18.00%\"><col style=\"width:22.00%\"><col style=\"width:42.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PAÍS</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">ESCALA</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">REGRAS</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">NORMA</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_br\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Brasil</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">I-IV</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">22</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"anvisa\">RDC 751/2022</a>, art. 5º e Anexo I</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_ar\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Argentina</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">I-IV</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">22</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a>, Parte 2 e Ap. II</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_mx\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">México</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">I-III</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Critério do art. 83</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"dof\">Reglamento de Insumos</a>, art. 83 + FEUM</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_co\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Colômbia</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">I, IIa, IIb, III</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">18</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"invima\">Decreto 4725</a>, arts. 5-7</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_pe\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Peru</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">I-IV</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">18</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"digemid\">DS 003-2020-SA</a>, art. 4 e Anexo 1</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_cl\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Chile</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">I-IV</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Não definidas no DS</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"bcn\">DS 825</a>, art. 20</span></p></td></tr></table></div><div class=\"apo-box apo-fix\"><b class=\"k\">Para fixar</b><p>O mesmo equipamento pode ser Classe III no Brasil, IIb na Colômbia e II ou III no México. Errar a classe é o primeiro motivo de exigência, porque a classe define o processo, a evidência e o prazo.</p></div><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Brasil e Argentina: mesma régua</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Brasil e Argentina trabalham com a mesma arquitetura: quatro classes, 22 regras e a exclusão de usados e IVD. A classificação feita para a ANVISA é o ponto de partida direto para a ANMAT. O que muda é o processo: no Brasil, Classes I e II vão por notificação, sem análise técnica; o RTM exige registro e deixa cada país simplificar I e II. Documentos, titular, taxas e validade são nacionais (no Brasil, o registro vale 10 anos, art. 11).</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"anvisa\">RDC 751/2022</a> arts. 2º, 5º, 6º, 7º, 10 e 11 e Anexo I; <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> Parte 1 item 4, Parte 2, Parte 3 itens 1, 10 e 13, Ap. II</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">México: três classes</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O <a class=\"hot\" data-refs=\"dof\">Reglamento de Insumos</a> classifica pelo quanto o produto é conhecido na prática médica e pelo tempo que fica no corpo. A partir da Classe II, a guia da COFEPRIS pede biocompatibilidade e estudos clínicos, com no mínimo três publicações indexadas ou avaliação por equivalência.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:14.00%\"><col style=\"width:86.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">CLASSE</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">CRITÉRIO (ART. 83 RIS)</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">I</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Conhecido, segurança e eficácia comprovadas, geralmente não entra no organismo</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">II</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Conhecido, pode variar material ou concentração, geralmente menos de 30 dias no organismo</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">III</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Novo ou recente, ou permanece mais de 30 dias no organismo</span></p></td></tr></table></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O registro vale cinco anos. Com a reforma do Reglamento publicada no DOF em 24/04/2026, as prórrogas passaram a ser de dez anos, com pedido até 150 dias naturais antes do vencimento. O importado entra pela homoclave <a class=\"hot\" data-refs=\"cofepris\">COFEPRIS-04-001-B</a>. A lei fixa prazos de resposta de 30, 35 e 60 dias por classe, e de 15 dias com parecer de Tercero Autorizado.</span></p><div class=\"apo-box apo-alerta\"><b class=\"k\">Atenção</b><p>Os prazos do art. 179 do <a class=\"hot\" data-refs=\"dof\">RIS</a> são legais. Antes de prometer datas ao cliente, confira o histórico recente da COFEPRIS.</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">RIS</a> arts. 83 e 179; <a class=\"hot\" data-refs=\"cofepris\">Guía COFEPRIS</a> para la obtención del Registro Sanitario de DM, itens 7.3 e 7.4; Decreto de reforma do <a class=\"hot\" data-refs=\"dof\">RIS</a>, DOF 24/04/2026, arts. 190 Bis 3 e 190 Bis 7</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Colômbia: automático ou com avaliação</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">As classes I e IIa saem por registro automático: o INVIMA confere se a documentação está completa e expede o ato, com verificação posterior (art. 17; expedição em 2 días, art. 22 b). As classes IIb e III passam por avaliação técnica, com 90 días hábiles para decidir a partir do dossiê completo (art. 16; art. 21, par. 2º, na redação do <a class=\"hot\" data-refs=\"invima\">Decreto 582/2017</a>). Se várias das 18 regras se aplicam, vale a classe mais alta (arts. 6 e 7).</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O registro vale 10 anos (art. 31), é cancelado se o produto não for comercializado em 36 meses (art. 46) e a renovação é pedida 3 meses antes do vencimento (art. 32).</span></p><div class=\"apo-box apo-caso\"><b class=\"k\">No estudo de caso</b><p>O software que controla o equipamento entra automaticamente na mesma classe dele (<a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a>, art. 6 b).</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> arts. 6 b e d, 7, 16, 17, 22 b, 31, 32 e 46; <a class=\"hot\" data-refs=\"invima\">Decreto 582/2017</a>, art. 1º</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">Peru e Chile</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O Peru tem a regra mais didática da região: o Anexo 1 do <a class=\"hot\" data-refs=\"digemid\">DS 003-2020-SA</a> traz 18 regras com exemplos concretos, alinhadas ao GHTF e ao <a class=\"hot\" data-refs=\"imdrf\">IMDRF</a>.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:60.00%\"><col style=\"width:22.00%\"><col style=\"width:18.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PRODUTO (PERU)</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">REGRA</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">CLASSE</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Ventilador pulmonar</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">R9 (i)</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">III</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Gerador eletrocirúrgico</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">R9 (i)</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">III</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Raios X diagnóstico</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">R10 (ii)</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">III</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Monitor de UTI e oxímetro</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">R10 (i)</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">III</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Marcapasso implantável</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">R8</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">IV</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Bisturi de uso único</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">R6</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">II</span></p></td></tr></table></div><div class=\"apo-box apo-alerta\"><b class=\"k\">Atenção</b><p>Cuidado com o nome: o bisturi de uso único é Classe II, pela regra 6; Classe III é o gerador eletrocirúrgico.</p></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">No Chile, a classe define os requisitos do artigo 21 do <a class=\"hot\" data-refs=\"bcn\">DS 825</a>, mas só depois de o produto entrar num decreto de controle.</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"digemid\">DS 003-2020-SA</a> Reglamento arts. 4 a 6 e Anexo 1 (regras 6, 8, 9 e 10); <a class=\"hot\" data-refs=\"bcn\">DS 825/1998</a> arts. 21 e 22</span></p><div class=\"apo-check\"><div class=\"ck\">Checagem rápida</div><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Na Colômbia, o software que controla um dispositivo médico:</span></p><p class=\"opt\" data-q=\"apo:q3\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">É sempre Classe I</span></p><p class=\"opt\" data-q=\"apo:q3\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Herda a classe do dispositivo que controla</span></p><p class=\"opt\" data-q=\"apo:q3\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Fica fora do registro</span></p><p class=\"opt\" data-q=\"apo:q3\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">É classificado só pela regra 10</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a>, art. 6 b</span></p></div><div class=\"apo-check\"><div class=\"ck\">Checagem rápida</div><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Quantas regras de classificação Brasil e Argentina compartilham?</span></p><p class=\"opt\" data-q=\"apo:q4\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">18</span></p><p class=\"opt\" data-q=\"apo:q4\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">22</span></p><p class=\"opt\" data-q=\"apo:q4\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">39</span></p><p class=\"opt\" data-q=\"apo:q4\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">4</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"anvisa\">RDC 751/2022</a>, Anexo I; <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a>, Ap. II</span></p></div><div class=\"apo-check apo-an\"><div class=\"ck\">Análise de caso 2</div><p style=\"margin-top:0px;margin-bottom:6px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Um colega classificou o equipamento do caso como Classe III no Peru citando a regra 6, por analogia com o bisturi de uso único.</span></p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">A justificativa se sustenta?</span></p><p class=\"opt\" data-q=\"apo:a2\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim: a regra 6 é a que classifica equipamentos ativos</span></p><p class=\"opt\" data-q=\"apo:a2\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não: pela regra 6 o bisturi de uso único é Classe II; equipamentos ativos terapêuticos ou de diagnóstico caem nas regras 9 e 10</span></p><p class=\"opt\" data-q=\"apo:a2\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Sim: o Peru adota a mesma classe do Brasil sem análise</span></p><p class=\"opt\" data-q=\"apo:a2\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não: o Peru não classifica dispositivos</span></p><details class=\"apo-why\"><summary>Ver justificativa</summary><p>A classe III pode até estar certa, mas a regra citada não. No Anexo 1 do <a class=\"hot\" data-refs=\"digemid\">DS 003-2020-SA</a>, ventilador e gerador eletrocirúrgico são Classe III pela regra 9, e monitor e raios X diagnóstico pela regra 10. Citar a regra errada é exigência na certa.</p></details><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"digemid\">DS 003-2020-SA</a>, Anexo 1, regras 6, 9 e 10</span></p></div><div class=\"apo-check apo-an\"><div class=\"ck\">Análise de caso 3</div><p style=\"margin-top:0px;margin-bottom:6px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O fabricante propõe registrar na Colômbia o software embarcado como produto separado, de Classe I, para usar o registro automático.</span></p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Qual é a sua recomendação?</span></p><p class=\"opt\" data-q=\"apo:a3\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Seguir: software é sempre Classe I</span></p><p class=\"opt\" data-q=\"apo:a3\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Não seguir: o software que controla o equipamento herda a classe dele; se o equipamento for IIb ou III, vale o registro com avaliação</span></p><p class=\"opt\" data-q=\"apo:a3\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Seguir, porque o INVIMA não avalia software</span></p><p class=\"opt\" data-q=\"apo:a3\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Seguir, desde que o software tenha aprovação FDA</span></p><details class=\"apo-why\"><summary>Ver justificativa</summary><p>O <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> diz que o software que controla um dispositivo herda a classe desse dispositivo (art. 6 b). Classes IIb e III seguem registro com avaliação, com 90 días hábiles a partir do dossiê completo (arts. 16 e 21).</p></details><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a>, arts. 6 b, 16 e 21, par. 2º</span></p></div><div class=\"apo-box apo-caso\"><b class=\"k\">No estudo de caso</b><p>Exercício do slide 14 (Caderno, E2): estime a classe provável do equipamento em cada país e diga a regra usada. Para o Chile, responda primeiro se ele está entre os 39 itens do <a class=\"hot\" data-refs=\"bcn\">Decreto Exento 25/2026</a>.</p></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Minhas anotações</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:100.00%\"></colgroup><tr><td colspan=\"1\" style=\"border-top:1.0px solid #D8DCE3;border-bottom:1.0px solid #D8DCE3;border-left:1.0px solid #D8DCE3;border-right:1.0px solid #D8DCE3;padding:5px 8px 5px 8px;\"><textarea class=\"fld\" data-k=\"apo:n12\" rows=\"3\" placeholder=\"Escreva aqui\"></textarea></td></tr></table></div><p class=\"emp\" style=\"margin-top:0.0px;margin-bottom:4.1px;font-size:5.4px\">&nbsp;</p>", "refs": ["anvisa", "cofepris", "dof", "mercosur", "invima", "digemid", "bcn", "imdrf"]}, {"id": "s4", "kicker": "SEÇÃO 1.3", "title": "Titular do registro", "ex": "1.3", "html": "<p style=\"margin-top:16.3px;margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:10.9px;color:#4A6CF7;letter-spacing:2.04px\">SEÇÃO 1.3</span></p><p style=\"margin-top:8.2px;margin-bottom:10.9px\"><span style=\"font-weight:700;font-size:21.8px;color:#011072\">Titular do registro</span></p><div class=\"apo-chips\"><span class=\"apo-chip\">No encontro: slides 15 a 17</span><span class=\"apo-chip ex\">Caderno: E3</span></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Em todos os países, o fabricante estrangeiro depende de uma empresa local, e quem é titular controla o registro. O desenho, porém, muda de país para país.</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:16.00%\"><col style=\"width:56.00%\"><col style=\"width:28.00%\"></colgroup><tr><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">PAÍS</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">QUEM PODE SER TITULAR</span></p></td><td style=\"border-bottom:1.4px solid #A8ADB7;padding:5px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:600;font-size:11.6px;color:#6E7480\">BASE</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_br\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Brasil</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Detentor: pessoa jurídica fabricante ou importadora responsável no Brasil, com AFE</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"anvisa\">RDC 751/2022</a>, art. 4º, VIII</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_ar\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Argentina</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Pessoa jurídica fabricante ou importadora, com estabelecimento habilitado</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">RTM Ap. I def. 4 e Ap. III 2.1</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_mx\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">México</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Representante legal no México com poder notarial, aviso de funcionamiento e responsable sanitario</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"cofepris\">Guía COFEPRIS</a> 1.2 e 1.4</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_co\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Colômbia</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Titular, fabricante e importador separados no registro; importador com CCAA</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"invima\">Decreto 4725</a>, arts. 10 e 20</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_pe\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Peru</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Laboratório ou droguería autorizada</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;background:#F0F2FF;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"digemid\">DS 016-2011-SA</a>, art. 8</span></p></td></tr><tr><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><img class=\"flag\" data-img=\"flag_cl\" alt=\"\"><span style=\"font-weight:700;font-size:13.6px;color:#011072\">Chile</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\">Quem fabrica, importa, comercializa ou distribui, com Inscrição de Empresa e Autorização de Bodega</span></p></td><td style=\"border-bottom:1.0px solid #D8DCE3;padding:6px 8px;\"><p style=\"margin-bottom:2.7px\"><span style=\"font-weight:400;font-size:13.6px;color:#171717\"><a class=\"hot\" data-refs=\"bcn\">DS 825</a>, art. 3; ISP 9100003</span></p></td></tr></table></div><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">No México, se o solicitante não for filial do fabricante, ainda entra a carta de representação. A exigência de AFE, no Brasil, vem da <a class=\"hot\" data-refs=\"anvisa\">Lei 6.360/1976</a>, não da <a class=\"hot\" data-refs=\"anvisa\">RDC 751/2022</a>.</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> Ap. I def. 4 e Ap. III 2.1; <a class=\"hot\" data-refs=\"cofepris\">Guía COFEPRIS</a> checklists 1.2, 1.4 e 1.9; <a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> arts. 2, 10, 20 e 29 d; <a class=\"hot\" data-refs=\"bcn\">DS 825/1998</a> art. 3; <a class=\"hot\" data-refs=\"digemid\">DS 016-2011-SA</a> art. 8; <a class=\"hot\" data-refs=\"anvisa\">RDC 751/2022</a> art. 4º, VIII</span></p><p style=\"margin-top:14.0px;margin-bottom:6.8px\"><span style=\"font-weight:700;font-size:17.0px;color:#011072\">O titular não é só um endereço</span></p><p style=\"margin-top:0px;margin-bottom:8.2px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Escolher o titular é uma decisão comercial e regulatória ao mesmo tempo. O titular precisa de habilitação vigente (AFE, estabelecimento habilitado, CCAA ou aviso de funcionamiento), responde às exigências no prazo (na Colômbia, 90 dias para complementar, art. 21 c), cuida de tecnovigilância e ações de campo (Colômbia, arts. 59 a 63; Chile, <a class=\"hot\" data-refs=\"bcn\">DS 825</a>, art. 28) e depende de uma carta do fabricante que o faculta (Colômbia, art. 29 d; RTM Parte 3, 6.c).</span></p><div class=\"apo-box apo-fix\"><b class=\"k\">Para fixar</b><p>O contrato com o titular precisa prever a transferência do registro se a relação terminar. No México, a cessão é notificada em até 30 dias úteis (<a class=\"hot\" data-refs=\"dof\">RIS</a>, art. 190).</p></div><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"invima\">Decreto 4725/2005</a> arts. 21 c, 29 d e 59 a 63; <a class=\"hot\" data-refs=\"bcn\">DS 825/1998</a> art. 28; <a class=\"hot\" data-refs=\"mercosur\">Res. GMC 25/21</a> Parte 3 item 6.c; <a class=\"hot\" data-refs=\"dof\">RIS</a> art. 190 e <a class=\"hot\" data-refs=\"cofepris\">Guía de Modificaciones COFEPRIS</a>, homoclave <a class=\"hot\" data-refs=\"cofepris\">COFEPRIS-2022-022-003</a></span></p><div class=\"apo-check\"><div class=\"ck\">Checagem rápida</div><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">No Peru, quem pode pedir o registro?</span></p><p class=\"opt\" data-q=\"apo:q5\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Qualquer distribuidor</span></p><p class=\"opt\" data-q=\"apo:q5\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Laboratório ou droguería autorizada</span></p><p class=\"opt\" data-q=\"apo:q5\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Somente o fabricante estrangeiro</span></p><p class=\"opt\" data-q=\"apo:q5\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O representante legal com poder notarial</span></p><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"digemid\">DS 016-2011-SA</a>, art. 8</span></p></div><div class=\"apo-check apo-an\"><div class=\"ck\">Análise de caso 4</div><p style=\"margin-top:0px;margin-bottom:6px\"><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O cliente quer nomear o distribuidor exclusivo no México como titular do registro, com um contrato que não fala em transferência.</span></p><p style=\"margin-top:0px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#011072\">Qual é o principal risco?</span></p><p class=\"opt\" data-q=\"apo:a4\" data-o=\"a\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">a)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Nenhum: o registro pertence sempre ao fabricante</span></p><p class=\"opt\" data-q=\"apo:a4\" data-o=\"b\" data-ok=\"1\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">b)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">Trocar de distribuidor exigirá a cessão do registro, que depende do titular e é notificada em até 30 dias úteis; sem cláusula de transferência, o fabricante fica refém</span></p><p class=\"opt\" data-q=\"apo:a4\" data-o=\"c\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">c)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">O registro é cancelado automaticamente em 36 meses</span></p><p class=\"opt\" data-q=\"apo:a4\" data-o=\"d\" style=\"margin-top:0px;margin-bottom:1.4px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:14.3px;color:#6E7480\">d)  </span><span style=\"font-weight:400;font-size:14.3px;color:#171717\">A COFEPRIS não aceita distribuidor como representante</span></p><details class=\"apo-why\"><summary>Ver justificativa</summary><p>Quem é titular controla o registro. No México, a cessão é notificada em até 30 dias úteis, com contrato protocolizado em cartório (<a class=\"hot\" data-refs=\"dof\">RIS</a>, art. 190). Por isso o contrato com o titular precisa prever a transferência se a relação terminar. O cancelamento em 36 meses é regra da Colômbia, não do México.</p></details><p style=\"margin-top:2.7px;margin-bottom:9.5px;padding-left:23.1px;text-indent:-23.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Fonte: </span><span style=\"font-weight:400;font-size:12.2px;color:#6E7480\"><a class=\"hot\" data-refs=\"dof\">RIS</a>, art. 190; <a class=\"hot\" data-refs=\"cofepris\">Guía de Modificaciones COFEPRIS</a>, homoclave <a class=\"hot\" data-refs=\"cofepris\">COFEPRIS-2022-022-003</a></span></p></div><div class=\"apo-box apo-caso\"><b class=\"k\">No estudo de caso</b><p>Discussão do slide 17 (Caderno, E3): em quais países você manteria o titular independente do distribuidor? A Colômbia, onde titular e importador já aparecem separados no registro, é um bom ponto de partida.</p></div><p style=\"margin-top:10.9px;margin-bottom:4.1px\"><span style=\"font-weight:700;font-size:12.2px;color:#6E7480\">Minhas anotações</span></p><div class=\"tw\"><table class=\"dt\" style=\"width:100.0%\"><colgroup><col style=\"width:100.00%\"></colgroup><tr>
